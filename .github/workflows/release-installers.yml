name: Release installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_VERSION: 0.1.${{ github.run_number }}
  PROJECT: src/LendWise.Web/LendWise.Web.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet test --configuration Release --no-restore

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:APP_VERSION -o publish
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows\LendWise.iss'
      - uses: actions/upload-artifact@v7
        with:
          name: lendwise-windows
          path: artifacts/*.exe
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            runtime: osx-x64
          - runner: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish "$PROJECT" -c Release -r '${{ matrix.runtime }}' --self-contained true -p:PublishSingleFile=true -p:Version="$APP_VERSION" -o publish
      - name: Build pkg
        run: |
          mkdir -p package-root/usr/local/lib/lendwise package-root/usr/local/bin artifacts
          cp -R publish/. package-root/usr/local/lib/lendwise/
          chmod +x package-root/usr/local/lib/lendwise/LendWise.Web
          ln -s ../lib/lendwise/LendWise.Web package-root/usr/local/bin/lendwise
          pkgbuild --root package-root --identifier com.yourfoxprodeveloper.lendwise --version "$APP_VERSION" "artifacts/LendWise-${APP_VERSION}-${{ matrix.runtime }}.pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: lendwise-${{ matrix.runtime }}
          path: artifacts/*.pkg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish "$PROJECT" -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:Version="$APP_VERSION" -o publish
      - name: Build deb and rpm
        run: |
          sudo apt-get update && sudo apt-get install -y ruby-dev rpm
          sudo gem install --no-document fpm
          mkdir -p package-root/usr/lib/lendwise package-root/usr/bin artifacts
          cp -R publish/. package-root/usr/lib/lendwise/
          chmod +x package-root/usr/lib/lendwise/LendWise.Web
          ln -s ../lib/lendwise/LendWise.Web package-root/usr/bin/lendwise
          fpm -s dir -t deb -n lendwise -v "$APP_VERSION" -C package-root -p "artifacts/lendwise_${APP_VERSION}_amd64.deb" .
          fpm -s dir -t rpm -n lendwise -v "$APP_VERSION" -C package-root -p "artifacts/lendwise-${APP_VERSION}-1.x86_64.rpm" .
      - uses: actions/upload-artifact@v7
        with:
          name: lendwise-linux
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: lendwise-*
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
